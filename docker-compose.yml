version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: glossary_user
      POSTGRES_PASSWORD: glossary_pass
      POSTGRES_DB: glossary_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: ./app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://glossary_user:glossary_pass@db:5432/glossary_db?schema=public"
    depends_on:
      - db

volumes:
  pgdata:
